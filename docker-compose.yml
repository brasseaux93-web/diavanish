services:
  diavanish:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"   # put a TLS reverse proxy (Caddy, nginx) in front
    volumes:
      - diavanish-data:/data
    environment:
      DIAVANISH_SECRET: ${DIAVANISH_SECRET:-${APERTURE_SECRET:-}}
      APERTURE_SECRET: ${DIAVANISH_SECRET:-${APERTURE_SECRET:-}}
      DIAVANISH_ADMIN_EMAIL: ${DIAVANISH_ADMIN_EMAIL:-${APERTURE_ADMIN_EMAIL:-}}
      APERTURE_ADMIN_EMAIL: ${DIAVANISH_ADMIN_EMAIL:-${APERTURE_ADMIN_EMAIL:-}}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DIAVANISH_MAIL_FROM: ${DIAVANISH_MAIL_FROM:-${APERTURE_MAIL_FROM:-}}
      APERTURE_MAIL_FROM: ${DIAVANISH_MAIL_FROM:-${APERTURE_MAIL_FROM:-}}
      DIAVANISH_MAIL_WEBHOOK: ${DIAVANISH_MAIL_WEBHOOK:-${APERTURE_MAIL_WEBHOOK:-}}
      APERTURE_MAIL_WEBHOOK: ${DIAVANISH_MAIL_WEBHOOK:-${APERTURE_MAIL_WEBHOOK:-}}
      DIAVANISH_MAIL_WEBHOOK_SECRET: ${DIAVANISH_MAIL_WEBHOOK_SECRET:-${APERTURE_MAIL_WEBHOOK_SECRET:-}}
      APERTURE_MAIL_WEBHOOK_SECRET: ${DIAVANISH_MAIL_WEBHOOK_SECRET:-${APERTURE_MAIL_WEBHOOK_SECRET:-}}
    # Writable surface is the data volume only. /tmp is a scratch tmpfs for
    # Node (HOME=/tmp). Everything else, including the image, is read-only.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  diavanish-data:
